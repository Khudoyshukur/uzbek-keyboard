name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generated files are up to date
        run: python3 tools/generate.py --check
      - name: Layout checks (incl. Apple DTD validation)
        run: python3 tests/check_layouts.py
      - name: Build .zip and .pkg
        run: ./macos/build.sh
      - name: No macOS metadata files in the package
        run: |
          if pkgutil --payload-files dist/*.pkg | grep '/\._'; then exit 1; fi
      - name: install.sh / --uninstall smoke test
        run: |
          # Ask the input-source service how many Uzbek Latin sources are enabled.
          enabled() {
            osascript -l JavaScript -e 'ObjC.import("Carbon");
              ObjC.bindFunction("TISCreateInputSourceList", ["void *", ["id", "bool"]]);
              ObjC.bindFunction("CFArrayGetCount", ["long", ["void *"]]);
              var l = $.TISCreateInputSourceList($.NSDictionary.dictionaryWithObjectForKey(
                "io.github.khudoyshukur.keyboardlayout.uzbek.uzbekkeyboard", "TISPropertyInputSourceID"), false);
              String(l ? $.CFArrayGetCount(l) : 0)'
          }
          # An entry in com.apple.HIToolbox is what used to cause duplicates.
          in_hitoolbox() { defaults read com.apple.HIToolbox AppleEnabledInputSources 2>/dev/null | grep -c '"Uzbek Keyboard"' || true; }
          debug() { sw_vers; echo "enabled=$(enabled)"; defaults read com.apple.inputsources 2>&1; defaults read com.apple.HIToolbox AppleEnabledInputSources 2>&1; }
          trap 'debug' ERR
          ./macos/install.sh </dev/null
          test -f "$HOME/Library/Keyboard Layouts/UzbekKeyboard.bundle/Contents/Info.plist"
          test "$(enabled)" = 1
          ./macos/install.sh </dev/null   # running twice must not add a duplicate
          test "$(enabled)" = 1
          test "$(in_hitoolbox)" = 0
          ./macos/install.sh --uninstall </dev/null
          test ! -e "$HOME/Library/Keyboard Layouts/UzbekKeyboard.bundle"
          test "$(enabled)" = 0
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build DLLs with kbdutool
        shell: pwsh
        run: ./windows/build.ps1
      - name: Install / uninstall smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:TEMP\uzk
          $dir = Get-ChildItem $env:TEMP\uzk -Directory | Select-Object -First 1
          & "$($dir.FullName)\install.ps1" -Quiet
          if (-not (Test-Path "$env:SystemRoot\System32\uzbekkb.dll")) { throw 'DLL not installed' }
          $reg = Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts' | Where-Object { (Get-ItemProperty $_.PSPath).'Layout File' -eq 'uzbekkb.dll' }
          if (-not $reg) { throw 'layout not registered' }
          Get-ItemProperty $reg.PSPath | Format-List
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          & "$($dir.FullName)\uninstall.ps1" -Quiet
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile keymap with libxkbcommon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-tools
          xkbcli compile-keymap --include "$PWD/linux/xkb" --include-defaults --layout uzbekkb > keymap.txt
          for sym in odiaeresis Odiaeresis gbreve Gbreve scedilla Scedilla ccedilla Ccedilla U02BC; do
            grep -q "$sym" keymap.txt || { echo "missing $sym"; exit 1; }
          done
      - name: install.sh / --uninstall smoke test
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          sh linux/install.sh
          test -f "$XDG_CONFIG_HOME/xkb/symbols/uzbekkb"
          xkbcli compile-keymap --layout uzbekkb | grep -q odiaeresis
          sh linux/install.sh --uninstall
          test ! -e "$XDG_CONFIG_HOME/xkb/symbols/uzbekkb"
      - name: Package
        run: |
          mkdir -p dist stage/UzbekKeyboard-Linux
          cp -R linux/xkb linux/install.sh LICENSE stage/UzbekKeyboard-Linux/
          tar -C stage -czf dist/UzbekKeyboard-Linux.tar.gz UzbekKeyboard-Linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Runs the exact one-line commands from the README against the new release.
  verify-release:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: macOS one-liner
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/macos/install.sh" | bash
          test -f "$HOME/Library/Keyboard Layouts/UzbekKeyboard.bundle/Contents/Resources/Uzbek Keyboard.icns"
          osascript -l JavaScript -e 'ObjC.import("Carbon");
            ObjC.bindFunction("TISCreateInputSourceList", ["void *", ["id", "bool"]]);
            ObjC.bindFunction("CFArrayGetCount", ["long", ["void *"]]);
            var l = $.TISCreateInputSourceList($.NSDictionary.dictionaryWithObjectForKey(
              "io.github.khudoyshukur.keyboardlayout.uzbek.uzbekkeyboard", "TISPropertyInputSourceID"), false);
            String(l ? $.CFArrayGetCount(l) : 0)' | grep -qx 1
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/macos/install.sh" | bash -s -- --uninstall
          test ! -e "$HOME/Library/Keyboard Layouts/UzbekKeyboard.bundle"
      - name: Windows one-liner
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $u = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/windows/get.ps1"
          irm $u | iex
          if (-not (Test-Path "$env:SystemRoot\System32\uzbekkb.dll")) { throw 'not installed' }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          & ([scriptblock]::Create((irm $u))) -Uninstall
          if (Test-Path "$env:SystemRoot\System32\uzbekkb.dll") { throw 'not removed' }
      - name: Linux one-liner
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/linux/install.sh" | sh
          test -f "$HOME/.config/xkb/symbols/uzbekkb"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/linux/install.sh" | sh -s -- --uninstall
          test ! -e "$HOME/.config/xkb/symbols/uzbekkb"
